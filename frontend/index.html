<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/iem-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management System | Institute of Engineering & Management, Kolkata</title>
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var demoToken = params.get('auth_token');
        if (demoToken) {
          localStorage.setItem('iem_library_token', demoToken);
        }
        var theme = localStorage.getItem('iem_library_theme') || localStorage.getItem('athena_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F0E5] text-[#292B27] font-sans antialiased min-h-screen selection:bg-[#A65F45]/20 selection:text-[#A65F45]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
